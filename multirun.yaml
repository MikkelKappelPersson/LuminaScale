hydra:
  run:
    dir: .
  sweep:
    dir: .
    subdir: ''
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: null
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - dequant_experiments=dequant_1,dequant_2,dequant_3
  job:
    name: train_dequant_net
    chdir: false
    override_dirname: dequant_experiments=dequant_1,dequant_2,dequant_3
    id: ???
    num: ???
    config_name: dequant
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /run/media/mikkelkp/MKP01/med8_project/LuminaScale
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /run/media/mikkelkp/MKP01/med8_project/LuminaScale/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      dequant_experiments: null
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
config_name: config
task_name: null
shard_path: dataset/ACEScct/full/shards/train
val_shard_path: dataset/ACEScct/full/shards/val
metadata_parquet: dataset/ACEScct/full/training_metadata.parquet
prefetch_size: 2
num_workers: 1
shuffle_buffer: 50
device: cuda
accelerator: gpu
devices: auto
strategy: auto
precision: '32'
enable_profiling: false
enable_compile: false
model:
  base_channels: 32
batch_size: 1
epochs: 30
checkpoint_freq: 5
save_top_k: 3
resume_ckpt_path: null
scheduler:
  learning_rate: 0.0001
  t_max: ${epochs}
  eta_min: 1.0e-06
loss:
  l1_weight: 1.0
  l2_weight: 0.0
  charbonnier_weight: 0.0
  grad_match_weight: 0.1
  total_variation_weight: 0.0
  total_variation_variant: huber
target_blur:
  start_sigma: 0.0
  end_sigma: 0.0
  anneal_epochs: ${eval:'${epochs} // 2'}
crop_size: 1024
val_crop_size: 1024
bit_crunch_contrast_min: 1.0
bit_crunch_contrast_max: 1.0
output_dir: ./outputs/training/dequant
