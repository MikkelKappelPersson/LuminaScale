hydra:
  run:
    dir: .
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: MULTIRUN
  searchpath: []
  callbacks: {}
  output_subdir: null
  overrides:
    hydra:
    - hydra.mode=MULTIRUN
    task:
    - mapper_experiments=mapper_1,mapper_2,mapper_3,mapper_4
  job:
    name: train_aces_mapper
    chdir: false
    override_dirname: mapper_experiments=mapper_1,mapper_2,mapper_3,mapper_4
    id: ???
    num: ???
    config_name: mapper
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.1'
    cwd: /run/media/mikkelkp/MKP01/med8_project/LuminaScale
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /run/media/mikkelkp/MKP01/med8_project/LuminaScale/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: ???
    choices:
      mapper_experiments: null
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
config_name: config
task_name: null
shard_path: dataset/ACEScct/full/shards/train
val_shard_path: dataset/ACEScct/full/shards/val
metadata_parquet: dataset/ACEScct/full/training_metadata.parquet
prefetch_size: 2
num_workers: 1
shuffle_buffer: 50
device: cuda
accelerator: gpu
devices: auto
strategy: auto
precision: bf16-mixed
enable_profiling: false
enable_compile: false
batch_size: 4
epochs: 10
checkpoint_freq: 5
save_top_k: 3
resume_ckpt_path: null
inference_vis_input_path: dataset/exr_ACES2065-1/MIT-Adobe_5K_a0001-jmac_DSC1459.exr
inference_vis_downsample_size: 1024
color_management:
  display: sRGB - Display
  view: ACES 2.0 - SDR 100 nits (Rec.709)
  lut_cube_size: 257
  auto_bake_luts: true
  aces2065_domain_min: -0.5
  aces2065_domain_max: 10.0
  acescct_domain_min: -1.0
  acescct_domain_max: 1.0
model:
  target: luminascale.models.aces_mapper.ACESMapper
  params:
    num_luts: 3
    lut_dim: 33
    num_lap: 3
    num_residual_blocks: 5
    sft_embed_dim: 64
    sft_depths:
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    - 1
    sft_num_heads:
    - 2
    - 4
    - 8
    - 16
    - 16
    - 8
    - 4
    - 2
    target_color_space: ACEScct
trainer:
  module: luminascale.training.aces_trainer.ACESMapperTrainer
  params:
    lr: 0.0001
    weight_decay: 0.0001
    lambda_l1: 1.0
    lambda_lpips: 0.1
    lambda_smooth: 0.0001
    lambda_mono: 0.0001
    target_color_space: ACEScct
crop_size: 512
output_dir: ./outputs/training/mapper
