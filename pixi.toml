[workspace]
authors = ["Mikkel Kappel Persson <mikkel@kappelpersson.dk>"]
channels = ["conda-forge"]
name = "LuminaScale"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
tensorboard = "PYTHONNOUSERSITE=1 tensorboard"
# tensorboard = "PYTHONNOUSERSITE=1 python -W \"ignore:pkg_resources is deprecated as an API:UserWarning\" -s scripts/run_tensorboard.py"

[system-requirements]
cuda = "12.8"

[dependencies]
python = "3.12.*"
cuda-version = "==12.8"
hydra-core = ">=1.3.2,<2"
omegaconf = ">=2.3.0,<3"
scikit-image = ">=0.26.0,<0.27"
imageio = ">=2.37.0,<3"
tqdm = ">=4.67.3,<5"
nanobind = ">=2.12.0,<3"
matplotlib = ">=3.10.8,<4"
jupyter = ">=1.1.1,<2"
scipy = ">=1.17.1,<2"
numpy = ">=2.4.2,<3"
pytorch-gpu = ">=2.7.1,<3"
torchvision = ">=0.22.0,<0.23"
tensorboard = ">=2.20.0,<3"
setuptools = ">=80,<81"
torch-tb-profiler = ">=0.4.3,<0.5"
pytorch-lightning = ">=2.6.1,<3"
pytest = ">=9.0.2,<10"
# triton = ">=3.3.0,<4"
kornia = ">=0.8.2,<0.9"
timm = ">=1.0.26,<2"
gradio = "6.*"
gradio-client = ">=2.5.0,<3"
pandas = ">=3.0.2,<4"
pillow = ">=11.3.0,<12"
pydantic = "2.10.*"
anyio = ">=4.13.0,<5"
sniffio = ">=1.3.1,<2"
pytz = ">=2026.2,<2027"


# Pixitainer (optional companion, see singularity/luminascale.def header):
#   pixi global install -c https://prefix.dev/raphaelribes pixitainer-singularity
#   pixi containerize-singularity          # quick throwaway image (no rawtoaces)
#   pixi containerize-singularity --dry-run --keep-def   # inspect generated .def
# Production image is built from singularity/luminascale.def instead.
[tool.pixitainer]
base-image = "pytorch/pytorch:2.10.0-cuda12.8-cudnn9-devel"
output = "luminascale-pixitainer.sif"
manual = true          # raw shell entrypoint, not the seamless pixi-run wrapper
no-install = true      # no baked env: install at runtime into writable storage
pixi-version = "0.78.0"

[pypi-dependencies]
openimageio = ">=3.1.11.0, <4"
opencolorio = ">=2.5.1, <3"
antlr4-python3-runtime = ">=4.9.3, <5"
webdataset = ">=0.2.118"
pyarrow = ">=15.0.0"
fastparquet = ">=2024.2.0"
# aim = ">=3.29.1, <4"
lpips = ">=0.1.4, <0.2"


